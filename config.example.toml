# gametrans — پیکربندی
# این فایل را به config.toml کپی کنید و ویرایش کنید:
#   copy config.example.toml config.toml
#
# همه‌ی مقادیر اختیاری‌اند؛ هرچه ننویسید، مقدار پیش‌فرض استفاده می‌شود.

log_level = "INFO"   # DEBUG برای عیب‌یابی
metrics   = true     # گزارش تاخیر هنگام خروج


# ─────────────────────────────────────────────────────────────
# ناحیه‌ی صفحه‌ای که زیرنویس در آن ظاهر می‌شود (پیکسل فیزیکی)
# با دستور `gametrans pick-region` خودکار پر می‌شود.
# ─────────────────────────────────────────────────────────────
[region]
left    = 0
top     = 0
width   = 0
height  = 0
monitor = 1


# ─────────────────────────────────────────────────────────────
# کپچر صفحه و دروازه‌ی تشخیص تغییر
# مهم‌ترین بخش برای تاخیر: فریم‌های بدون تغییر اصلاً به OCR نمی‌رسند.
# ─────────────────────────────────────────────────────────────
[capture]
backend    = "auto"   # auto | mss | dxcam  (dxcam روی ویندوز سریع‌تر است)
target_fps = 12       # نرخ نمونه‌برداری. بالاتر = واکنش سریع‌تر، CPU بیشتر

# آستانه‌ی «فریم عوض شده». اگر زیرنویس‌ها دیر تشخیص داده می‌شوند این را کم کنید؛
# اگر بی‌دلیل ترجمه تکرار می‌شود، زیادش کنید.
hash_threshold  = 4
pixel_threshold = 2.5   # فقط وقتی text_mask = false باشد استفاده می‌شود

# مقایسه بر اساس «امضای متن» به‌جای خود تصویر.
# بیشتر بازی‌ها زیرنویس را مستقیم روی صحنه می‌کشند، پس با حرکت دوربین کل تصویر
# عوض می‌شود و دروازه هر فریم شلیک می‌کند. با این گزینه فقط پیکسل‌هایی شمرده
# می‌شوند که «شبیه حرف» باشند — لبه‌ی تیز و روشن.
# اندازه‌گیری روی صحنه‌ی متحرک: بدون آن ۶۰ از ۶۰ فریم، با آن ۲ از ۶۰.
text_mask            = true
mask_pixel_threshold = 0.03
mask_blur            = 9
mask_edge            = 26.0
# اگر زیرنویس بازی کم‌نور یا رنگی است این را کم کنید (مثلاً ۱۳۰)؛
# اگر صحنه‌ی روشن باعث شلیک بی‌مورد می‌شود، زیادش کنید.
mask_bright          = 170.0


# ─────────────────────────────────────────────────────────────
# تشخیص متن (OCR)
# ─────────────────────────────────────────────────────────────
[ocr]
backend        = "auto"    # auto | windows | rapidocr | tesseract
languages      = ["en"]    # زبان متن بازی (نه زبان مقصد)
upscale        = 2.0       # بزرگ‌نمایی قبل از OCR؛ برای زیرنویس ریز ۲ تا ۳ خوب است
# سقف تعداد پیکسلی که به OCR داده می‌شود. هم تغییر اندازه و هم خود OCR با تعداد
# پیکسل رشد می‌کنند، پس این هزینه‌ی هر فریم را مهار می‌کند — مهم برای صفحه‌های
# ۲K و ۴K که متن از قبل بزرگ است و بزرگ‌نمایی فقط وقت تلف می‌کند.
max_pixels     = 2000000   # ۰ یعنی بدون سقف
min_confidence = 0.45      # خطوط با اطمینان کمتر دور ریخته می‌شوند
single_block   = true      # ناحیه را یک بلوک متنی یکپارچه فرض کن
binarize       = false     # برای زیرنویس سفید روی زمینه‌ی تیره گاهی کمک می‌کند
# tesseract_cmd = "C:\\Program Files\\Tesseract-OCR\\tesseract.exe"


# ─────────────────────────────────────────────────────────────
# چه‌وقت متن «تمام‌شده» حساب شود
# frames_required = 1 یعنی بلافاصله ترجمه کن (کمترین تاخیر، ریسک جمله‌ی نیمه)
# ─────────────────────────────────────────────────────────────
[stability]
frames_required      = 2
max_wait_ms          = 220   # سقف انتظار؛ بعد از این حتماً ترجمه می‌شود
similarity_threshold = 0.93
min_chars            = 2


# ─────────────────────────────────────────────────────────────
# ترجمه
# ─────────────────────────────────────────────────────────────
[translate]
target_language = "Persian (Farsi)"
source_language = "auto"
stream          = true    # نمایش تدریجی متن به‌محض رسیدن توکن‌ها
concurrency     = 3       # چند ترجمه هم‌زمان
stale_after_ms  = 6000    # ترجمه‌ای که دیرتر از این برسد دور ریخته می‌شود

# راهنمای لحن و فضای بازی — کیفیت ترجمه را محسوس بهتر می‌کند
context_hint = ""
# context_hint = "Elden Ring — فانتزی تاریک، لحن کهن و رسمی"

cache_path        = "translation-cache.sqlite3"  # "" برای غیرفعال کردن
cache_memory_size = 2048

# واژه‌نامه: اصطلاحاتی که همیشه باید یکسان ترجمه شوند
[translate.glossary]
# "Site of Grace" = "جایگاه فیض"
# "Estus Flask"   = "فلاسک اِستوس"


# ─────────────────────────────────────────────────────────────
# زنجیره‌ی موتورهای ترجمه
# به ترتیب امتحان می‌شوند؛ هرکدام به سقف نرخ خورد یا خطا داد،
# خودکار می‌رود سراغ بعدی.
# ─────────────────────────────────────────────────────────────

# ۱) Gemini — بهترین کیفیت فارسی بین گزینه‌های رایگان
#    کلید رایگان: https://aistudio.google.com/apikey
[[translate.providers]]
name        = "gemini-flash-lite"
kind        = "gemini"
model       = "gemini-3.5-flash-lite"
api_key_env = "GEMINI_API_KEY"
rpm_limit   = 15      # سقف رایگان: ۱۵ درخواست در دقیقه
timeout_s   = 10.0

# ۲) Groq — سریع‌ترین، و سقف روزانه‌اش ۲۰ برابر Gemini است
#    کلید رایگان: https://console.groq.com/keys
[[translate.providers]]
name        = "groq-qwen"
kind        = "openai"
model       = "qwen/qwen3.6-27b"
api_key_env = "GROQ_API_KEY"
base_url    = "https://api.groq.com/openai/v1"
rpm_limit   = 30
timeout_s   = 10.0
# Qwen 3.6 حالت «فکر کردن» دارد که پیش‌فرض روشن است و فقط تاخیر اضافه می‌کند.
extra       = { reasoning_effort = "none" }
# نام مدل‌ها گاهی منسوخ می‌شوند — با `gametrans models` لیست زنده را ببینید.

# ۳) مدل لوکال — کاملاً آفلاین و بدون سقف. برای فعال کردن enabled = true
# aya-expanse:8b در اندازه‌گیری روی دیالوگ بازی بهترین فارسیِ مدل‌های ۸B بود.
# با `gametrans compare-models` (منوی ۷) روی سخت‌افزار خودتان بسنجید.
[[translate.providers]]
name        = "ollama-local"
kind        = "openai"
model       = "aya-expanse:8b"
base_url    = "http://127.0.0.1:11434/v1"
rpm_limit   = 0
timeout_s   = 30.0
enabled     = false
# keep_alive نمی‌گذارد مدل وسط بازی از حافظه خارج شود؛ بدون آن، خط بعدی
# باید منتظر بارگذاری دوباره بماند.
extra       = { keep_alive = "30m", reasoning_effort = "none" }

# ۴) Claude — بهترین کیفیت فارسی در کل، ولی پولی. برای فعال کردن enabled = true
# [[translate.providers]]
# name        = "claude"
# kind        = "anthropic"
# model       = "claude-haiku-4-5"   # یا "claude-opus-5" برای کیفیت بالاتر
# api_key_env = "ANTHROPIC_API_KEY"
# timeout_s   = 12.0
# enabled     = false


# ─────────────────────────────────────────────────────────────
# ظاهر اورلی
# ─────────────────────────────────────────────────────────────
[overlay]
# region = درست زیر ناحیه‌ی کپچر | bottom = پایین صفحه | top = بالای صفحه
# custom = مختصات دستی با x و y
anchor            = "region"
# x = 0
# y = 0
# width = 0                    # ۰ یعنی هم‌عرض ناحیه

font_family       = "Vazirmatn, Segoe UI, Tahoma, sans-serif"
font_size         = 26
font_weight       = 600

text_color         = "#FFFFFF"
background_color   = "#000000"
background_opacity = 0.62
outline_color      = "#000000"
outline_width      = 2.4

padding       = 14
corner_radius = 10
line_spacing  = 1.35
max_lines     = 4
linger_ms     = 2600    # هر خط چند میلی‌ثانیه بماند و بعد محو شود

# چند خط اخیر هم‌زمان روی صفحه بمانند. دیالوگ بازی معمولاً سریع‌تر از آن است که
# بشود به زبان دوم خواند؛ نگه داشتن چند خط آخر فرصت خواندن می‌دهد.
# ۱ یعنی همان حالت تک‌خطی.
history_lines = 3
history_dim   = 0.55    # خطوط قدیمی‌تر کم‌رنگ‌تر می‌شوند
fade_ms       = 450     # مدت محو شدن

show_source  = false    # نمایش متن اصلی زیر ترجمه
show_latency = false    # نمایش زنده‌ی تاخیر و نرخ کش


# ─────────────────────────────────────────────────────────────
# کلیدهای میان‌بر سراسری (نیاز به: pip install "gametrans[hotkeys]")
# ─────────────────────────────────────────────────────────────
[hotkeys]
enabled        = true
toggle_pause   = "ctrl+alt+p"
toggle_overlay = "ctrl+alt+h"
pick_region    = "ctrl+alt+r"
quit           = "ctrl+alt+q"
