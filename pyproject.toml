[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gametrans"
version = "0.2.0"
description = "Low-latency on-screen game text translator with Persian (RTL) overlay"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "mss>=9.0.1",
    "numpy>=1.24",
    "Pillow>=10.0",
    "PySide6>=6.6",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# OCR engines - install at least one. `windows` is the fastest on Win10/11.
windows = ["winsdk>=1.0.0b10"]
rapidocr = ["rapidocr-onnxruntime>=1.3.24"]
tesseract = ["pytesseract>=0.3.10"]
# Optional cloud backend that ships an official SDK
anthropic = ["anthropic>=0.40"]
# Faster Windows capture path
# dxcam falls back to an OpenCV colour-conversion path when it cannot use
# its native format, and imports cv2 lazily at first grab.
dxcam = ["dxcam>=0.0.5", "opencv-python-headless>=4.8"]
hotkeys = ["keyboard>=0.13.5"]
dev = ["pytest>=8.0"]

[project.scripts]
gametrans = "gametrans.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
